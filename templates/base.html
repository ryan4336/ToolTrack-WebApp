<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ToolTrack{% endblock %}</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <nav class="navbar">
            <a class="logo" href="{{ url_for('dashboard') }}">
                ToolTrack
            </a>

            <div class="nav-links">
                <a href="{{ url_for('tool_inventory') }}">Tool Inventory</a>
                <a href="{{ url_for('employees') }}">Employees</a>
                <a href="{{ url_for('assignments') }}">Assignments</a>
                <a href="{{ url_for('tool_types') }}">Tool Categories</a>
            </div>

            <div class="account-links">
                <a href="{{ url_for('change_password') }}">Change Password</a>
                <a href="{{ url_for('logout') }}">Log Out</a>
            </div>
        </nav>
        
    </header>

    <main class="page-content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
