{% extends "base.html" %}

{% block title %}Add Employee | ToolTrack{% endblock %}

{% block content %}
    <h1 class="form-title">Add Employee</h1>

    <!-- Show an error if required information is missing or saving fails -->
    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST" class="form"action="{{ url_for('add_employee') }}">

        <!-- Keep entered values if the form needs to be corrected -->
        <div class="form-group">
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                maxlength="150"
                value="{{ request.form.get('name', '') }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                maxlength="254"
                value="{{ request.form.get('email', '') }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="phone_number">Phone Number (optional)</label>
            <input
                type="tel"
                id="phone_number"
                name="phone_number"
                maxlength="30"
                value="{{ request.form.get('phone_number', '') }}"
            >
        </div>

        <div class="form-group">
            <label for="job_title">Job Title</label>
            <input
                type="text"
                id="job_title"
                name="job_title"
                maxlength="100"
                value="{{ request.form.get('job_title', '') }}"
                required
            >
        </div>

        <div class="form-actions">
            <a class="button button-cancel" href="{{ url_for('employees') }}">Cancel</a>
            <button type="submit" class="button">Save Changes</button>
        </div>
    </form>
{% endblock %}
