{% macro action_icon(name) %}
<svg xmlns="http://www.w3.org/2000/svg"
     width="18" height="18"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="2"
     stroke-linecap="round"
     stroke-linejoin="round"
     aria-hidden="true"
     focusable="false">

    {% if name == "edit" %}
        <!-- Pencil -->
        <path d="M16 3l5 5-12 12-6 1 1-6z"/>
        <path d="M14 5l5 5"/>

    {% elif name == "assign" %}
        <!-- Clipboard with a plus sign -->
        <rect x="5" y="4" width="14" height="17" rx="2"/>
        <rect x="9" y="2" width="6" height="4" rx="1"/>
        <path d="M12 10v7M8.5 13.5h7"/>

    {% elif name == "view" %}
        <!-- Eye -->
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
        <circle cx="12" cy="12" r="3"/>

    {% elif name == "return" %}
        <!-- Return arrow -->
        <path d="M9 5l-5 5 5 5"/>
        <path d="M4 10h10a6 6 0 0 1 0 12"/>
        
    {% elif name == "history" %}
    <!-- Clock with a backward arrow -->
    <path d="M3 11a9 9 0 1 1 2.7 7.4"/>
    <path d="M3 4v7h7"/>
    <path d="M12 7v5l3 2"/>
    {% endif %}
</svg>
{% endmacro %}
