{% extends "base.html" %}

{% block title %}Edit Tool | ToolTrack{% endblock %}

{% block content %}

<h1 class="form-title">Edit Tool</h1>

{% if error %}
    <p class="form-error">{{ error }}</p>
{% endif %}

<form method="POST" class="form" id="edit-tool-form">

    <div class="form-group">
        <label for="asset_tag">Asset Tag</label>
        <input type="text" id="asset_tag" name="asset_tag"
            value="{{ request.form.get('asset_tag', tool.asset_tag) }}"
            maxlength="50" required>
    </div>
    
    <!-- Select an existing tool name -->
    <div class="form-group">
        <label for="tool_name">Tool Category</label>
        <select id="tool_name" name="tool_name" required>
            <option value="" disabled>
                Select a Tool Category
            </option>

            {% for name in tool_names %}
                <option value="{{ name }}"
                    {% if request.form.get('tool_name', tool.tool_name) == name %}
                        selected
                    {% endif %}>
                    {{ name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="brand">Brand</label>
        <input type="text" id="brand" name="brand"
            value="{{ request.form.get('brand', tool.brand) }}"
            maxlength="100">
    </div>

    <div class="form-group">
        <label for="model">Model</label>
        <input type="text" id="model" name="model"
            value="{{ request.form.get('model', tool.model) }}"
            maxlength="100">
    </div>

    <div class="form-group">
        <label for="serial_number">Serial Number</label>
        <input type="text" id="serial_number" name="serial_number"
            value="{{ request.form.get('serial_number', tool.serial_number) }}"
            maxlength="100">
    </div>


    <div class="form-group">
        <label for="purchase_date">Purchase Date</label>
        <input type="date" id="purchase_date" name="purchase_date"
            value="{{ request.form.get('purchase_date', tool.purchase_date) }}"
            required>
    </div>

    <div class="form-group">
        <label for="price">Purchase Price</label>
        <input type="number" id="price" name="price"
            value="{{ request.form.get('price', tool.price if tool.price is not none else '') }}"
            min="0" step="0.01" required>
    </div>

    <div class="form-group">
        <label for="status">Status</label>
        <input type="text" id="status" value="{{ tool.status }}" disabled>
    </div>

    <div class="form-group">
        <label for="condition">Condition</label>
        {% set condition_value = request.form.get('condition', tool.condition ) %}
        <select id="condition" name="condition" required>
            {% for option in ['New', 'Good', 'Fair', 'Poor', 'Unknown'] %}
            <option value="{{ option }}" {% if condition_value == option %}selected{% endif %}>
                {{ option }}
            </option>
        {% endfor %}
        </select>
    </div>


    <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="4">{{ request.form.get('notes', tool.notes or '') }}</textarea>
    </div>

    <div class="form-actions">
        <a class="button button-cancel" href="{{ url_for('tool_inventory') }}">Cancel</a>
        <button type="submit" class="button">Save Changes</button>
    </div>
</form>



{% endblock %}
