{% extends "base.html" %}

{% block title %}Add Tool | ToolTrack{% endblock %}

{% block content %}
<h1 class="form-title">Add Tool</h1>

{% if error %}
    <p class="form-error">{{ error }}</p>
{% endif %}

<form method="POST" class="form" id="add-tool-form" action="{{ url_for('add_tool') }}">
        <div class="form-group">
            <label for="tool_name">Tool Name</label>
            <input
                type="text"
                id="tool_name"
                name="tool_name"
                maxlength="150"
                value="{{ request.form.get('tool_name', '') }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="brand">Brand (optional)</label>
            <input
                type="text"
                id="brand"
                name="brand"
                maxlength="100"
                value="{{ request.form.get('brand', '') }}"
            >
        </div>

        <div class="form-group">
            <label for="model">Model (optional)</label>
            <input
                type="text"
                id="model"
                name="model"
                maxlength="100"
                value="{{ request.form.get('model', '') }}"
            >
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <input
                type="text"
                id="category"
                name="category"
                maxlength="100"
                value="{{ request.form.get('category', '') }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="asset_tag">Asset Tag</label>
            <input
                type="text"
                id="asset_tag"
                name="asset_tag"
                maxlength="50"
                value="{{ request.form.get('asset_tag', '') }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="serial_number">Serial Number</label>
            <input
                type="text"
                id="serial_number"
                name="serial_number"
                maxlength="100"
                value="{{ request.form.get('serial_number', '') }}"
                required
            >
        </div>
        
        <div class="form-group">
            <label for="purchase_date">Purchase Date</label>
            <input
                type="date"
                id="purchase_date"
                name="purchase_date"
                value="{{ request.form.get('purchase_date', '') }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="price">Purchase Price</label>
            <input
                type="number"
                id="price"
                name="price"
                min="0"
                step="0.01"
                value="{{ request.form.get('price', '') }}"
                required
            >
        </div>
        
        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status" required>
                <option value="" disabled {%if not request.form.get('status') %}selected{% endif %}>Select a Status</option>
                {% for option in statuses %}
                    <option value = "{{ option }}" {% if request.form.get('status') == option %}selected{% endif %}>{{ option }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="condition">Condition</label>
            <select id="condition" name="condition" required>
                <option value="" disabled {%if not request.form.get('condition') %}selected{% endif %}>Select a Condition</option>
                {% for option in conditions %}
                    <option value = "{{ option }}" {% if request.form.get('condition') == option %}selected{% endif %}>{{ option }}</option>
                {% endfor %}
            </select>
        </div>

    </div>

    <div class="form-actions">
            <a class="button button-cancel" href="{{ url_for('tool_inventory') }}">Cancel</a>
            <button type="submit" class="button">Add Tool</button>
        </div>

</form>
{% endblock %}
